name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -version | python3 -c 'import sys; major=int(sys.stdin.readline().split()[1].split(".")[0]); assert major >= 26, "Use Xcode 26+ for current App Store submissions"'

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in sorted(devices.items(), reverse=True):
              if "iOS" in runtime:
                  for device in entries:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          xcodebuild test \
            -project Flashcards.xcodeproj \
            -scheme Flashcards \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release archive
        run: |
          xcodebuild archive \
            -project Flashcards.xcodeproj \
            -scheme Flashcards \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flashies.xcarchive \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flashies-test-results
          path: TestResults.xcresult
